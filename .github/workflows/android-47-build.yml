name: Android Debug Build (4.7 port)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: MiniCPM-V-demo-Android
    steps:
      - name: Checkout (with llama.cpp-omni submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27 (27.0.12077973, pinned by app/build.gradle.kts)
        run: sdkmanager "ndk;27.0.12077973"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minicpm-v-47-debug-apk
          path: MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
