name: Android Debug Build (4.7 port)

on:
  workflow_dispatch:
  push:
    branches: [android-4.7-port]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: MiniCPM-V-demo-Android
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout (with llama.cpp-omni submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses and install NDK r27
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;27.0.12077973" "platform-tools"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minicpm-v-47-debug-apk
          path: MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
